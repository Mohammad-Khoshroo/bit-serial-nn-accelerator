<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FSM Diagram Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f0f2f5; }
        #toolbar { background: #fff; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        #toolbar h2 { margin: 0; color: #333; font-size: 18px;}
        #toolbar button { background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #toolbar button:hover { background: #45a049; }
        #cy { flex-grow: 1; width: 100%; height: 100%; background: #fafafa; background-image: radial-gradient(#e0e0e0 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body>
    <div id="toolbar">
        <h2>دیاگرام ماشین حالت (FSM) - cluster_ctrl</h2>
        <button onclick="exportImage()">📸 خروجی عکس (PNG)</button>
    </div>
    <div id="cy"></div>

    <script>
        const elements = [
    {
        "data": {
            "id": "S_IDLE",
            "label": "S_IDLE"
        }
    },
    {
        "data": {
            "id": "S_LD_BETA",
            "label": "S_LD_BETA"
        }
    },
    {
        "data": {
            "id": "S_WAIT_BETA",
            "label": "S_WAIT_BETA"
        }
    },
    {
        "data": {
            "id": "S_WAIT_MEM",
            "label": "S_WAIT_MEM"
        }
    },
    {
        "data": {
            "id": "S_CALCULATE",
            "label": "S_CALCULATE"
        }
    },
    {
        "data": {
            "id": "S_WRITE_TO_MEM",
            "label": "S_WRITE_TO_MEM"
        }
    },
    {
        "data": {
            "id": "S_WAIT_ACK",
            "label": "S_WAIT_ACK"
        }
    },
    {
        "data": {
            "id": "S_IDLE_to_S_LD_BETA_start",
            "source": "S_IDLE",
            "target": "S_LD_BETA",
            "label": "start"
        }
    },
    {
        "data": {
            "id": "S_IDLE_to_S_IDLE_!start",
            "source": "S_IDLE",
            "target": "S_IDLE",
            "label": "!start"
        }
    },
    {
        "data": {
            "id": "S_CALCULATE_to_S_WRITE_TO_MEM_input_counter_co",
            "source": "S_CALCULATE",
            "target": "S_WRITE_TO_MEM",
            "label": "input_counter_co"
        }
    },
    {
        "data": {
            "id": "S_CALCULATE_to_S_CALCULATE_!input_counter_co",
            "source": "S_CALCULATE",
            "target": "S_CALCULATE",
            "label": "!input_counter_co"
        }
    },
    {
        "data": {
            "id": "S_WAIT_ACK_to_S_IDLE_~start",
            "source": "S_WAIT_ACK",
            "target": "S_IDLE",
            "label": "~start"
        }
    },
    {
        "data": {
            "id": "S_WAIT_ACK_to_S_WAIT_ACK_start",
            "source": "S_WAIT_ACK",
            "target": "S_WAIT_ACK",
            "label": "start"
        }
    }
];

        const cy = cytoscape({
            container: document.getElementById('cy'),
            elements: elements,
            style: [
                {
                    selector: 'node',
                    style: {
                        'label': 'data(label)',
                        'text-valign': 'center',
                        'color': '#fff',
                        'background-color': '#673AB7',
                        'border-width': 2,
                        'border-color': '#512DA8',
                        'width': 120,
                        'height': 50,
                        'font-size': '14px',
                        'font-weight': 'bold',
                        'shape': 'roundrectangle'
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'label': 'data(label)',
                        'curve-style': 'bezier',
                        'target-arrow-shape': 'triangle',
                        'target-arrow-color': '#555',
                        'line-color': '#555',
                        'width': 2,
                        'text-background-color': '#fff',
                        'text-background-opacity': 1,
                        'text-background-padding': '2px',
                        'text-background-shape': 'roundrectangle',
                        'font-size': '12px',
                        'color': '#333',
                        'text-rotation': 'autorotate',
                        'loop-direction': '180deg',
                        'loop-sweep': '30deg'
                    }
                }
            ],
            layout: {
                name: 'cose',
                animate: true,
                nodeRepulsion: 10000,
                idealEdgeLength: 150
            }
        });

        function exportImage() {
            const png64 = cy.png({
                full: true,
                scale: 3,
                bg: '#ffffff'
            });
            
            const a = document.createElement('a');
            a.href = png64;
            a.download = 'cluster_ctrl_fsm.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
